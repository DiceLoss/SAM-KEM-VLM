name: sam-kem-v3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pytorch::pytorch>=2.10.0
  - pytorch::torchvision
  - numpy>=1.24
  - scipy>=1.10
  - scikit-image>=0.20
  - matplotlib>=3.7
  - pandas>=2.0
  - pyyaml>=6.0
  - tqdm>=4.65
  - loguru
  - einops
  - pytorch::pytorch-cuda=13.1
  - pip
  - pip:
    - opencv-python>=4.7
    - nibabel>=5.0
    - torchmetrics>=1.0
    - git+https://github.com/facebookresearch/sam2.git@v0.1.0