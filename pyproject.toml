[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-kem"
version = "0.1.0"
description = "Auditable PET reconstruction pipeline for SAM-KEM"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
evaluation = ["scikit-image>=0.20,<1", "pandas>=2,<3", "Pillow>=10,<13"]
medsam2 = [
  "torch>=2.5.1,<3",
  "torchvision>=0.20.1,<1",
  "hydra-core>=1.3.2,<2",
  "iopath>=0.1.10,<1",
  "tqdm>=4.66.5,<5",
  "SimpleITK>=2.4,<3",
  "opencv-python>=4.7,<5",
]
data = ["nibabel>=5,<6"]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sam-kem = "sam_kem.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["sam_kem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["code"]
