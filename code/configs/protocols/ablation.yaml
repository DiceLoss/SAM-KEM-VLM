name: component_ablation_test
kind: ablation
split: test_locked
methods:
  - full_qwen_trained_decoder_post_fusion
  - centroid_box_only
  - released_decoder_only
  - no_post_fusion
  - prior_only
datasets: [brainweb, hecktor]
count_levels: [200000]
one_factor_at_a_time: true
reference_variant: full_qwen_trained_decoder_post_fusion
variant_changes:
  centroid_box_only: box_source
  released_decoder_only: decoder_checkpoint
  no_post_fusion: post_fusion_alpha
  prior_only: reconstruction_component
requires_frozen_hyperparameters: true
forbid_aliasing_from_other_methods: true
output: runs/ablation
